name: HCP EMO Live Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hcp-live-validation.yml"
      - "scripts/validate_hcp_emo_regional_live.py"
      - "pipeline/collectors.py"
      - "pipeline/hcp_regional.py"
      - "tests/test_hcp_regional.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  validate-hcp-regional-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate live HCP EMO PDF extraction and build preview dataset
        run: PYTHONPATH=. python scripts/validate_hcp_emo_regional_live.py
      - name: Upload HCP regional dataset preview
        uses: actions/upload-artifact@v4
        with:
          name: hcp-regional-statistics-preview
          path: |
            data/regional-statistics.json
            public/data/regional-statistics.json
          if-no-files-found: error
          retention-days: 7
