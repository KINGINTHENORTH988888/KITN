name: HCP EMO Live Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hcp-live-validation.yml"
      - "scripts/validate_hcp_emo_regional_live.py"
      - "pipeline/collectors.py"
      - "pipeline/hcp_regional.py"
      - "pipeline/hcp_social.py"
      - "scripts/publish_hcp_social_preview.py"
      - "tests/test_hcp_regional.py"
      - "tests/test_hcp_social.py"
      - "data/sources.json"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  validate-hcp-regional-pdf:
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/kitn-quality-review-2026-11' && !contains(github.event.pull_request.head.commit.message, '[skip hcp data refresh]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate live HCP EMO PDF extraction and build preview dataset
        run: PYTHONPATH=. python scripts/validate_hcp_emo_regional_live.py
      - name: Extract and publish HCP 2026 social indicators to review preview
        run: PYTHONPATH=. python scripts/publish_hcp_social_preview.py
      - name: Upload HCP statistics preview
        uses: actions/upload-artifact@v4
        with:
          name: hcp-statistics-preview
          path: |
            data/regional-statistics.json
            public/data/regional-statistics.json
            data/statistics.json
            public/data/statistics.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify frontend with live regional dataset
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Test and build frontend with HCP regional data
        run: |
          npm ci
          npm run test:frontend
          npm run build
      - name: Commit verified HCP regional datasets to isolated review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/regional-statistics.json public/data/regional-statistics.json
          # Preserve only the generated data while moving to the latest branch tip.
          # A soft reset leaves the old index intact and can accidentally revert
          # concurrent source-code changes when this workflow commits its dataset.
          mkdir -p /tmp/kitn-hcp-preview/data /tmp/kitn-hcp-preview/public/data
          cp data/regional-statistics.json /tmp/kitn-hcp-preview/data/regional-statistics.json
          cp public/data/regional-statistics.json /tmp/kitn-hcp-preview/public/data/regional-statistics.json
          cp data/statistics.json /tmp/kitn-hcp-preview/data/statistics.json
          cp public/data/statistics.json /tmp/kitn-hcp-preview/public/data/statistics.json
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout --force --detach FETCH_HEAD
          cp /tmp/kitn-hcp-preview/data/regional-statistics.json data/regional-statistics.json
          cp /tmp/kitn-hcp-preview/public/data/regional-statistics.json public/data/regional-statistics.json
          cp /tmp/kitn-hcp-preview/data/statistics.json data/statistics.json
          cp /tmp/kitn-hcp-preview/public/data/statistics.json public/data/statistics.json
          git add -- data/regional-statistics.json public/data/regional-statistics.json data/statistics.json public/data/statistics.json
          if ! git diff --staged --quiet; then
            git commit -m "[skip hcp data refresh] chore(data): publish verified HCP regional dataset"
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_HEAD_REF"
              if ! git rebase FETCH_HEAD; then
                git rebase --abort || true
                echo "La branche a reçu des changements incompatibles ; arrêt sans écraser le code."
                exit 1
              fi
              if git push origin "HEAD:$GITHUB_HEAD_REF"; then
                exit 0
              fi
              echo "Push concurrent détecté (tentative $attempt/3)."
              sleep $((attempt * 2))
            done
            echo "Impossible de publier les données HCP après trois tentatives."
            exit 1
          else
            echo "HCP regional datasets are already current."
          fi
