name: KITN Veille Automatisée

on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: kitn-veille-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies if present
        run: |
          if [ -f requirements.txt ]; then
            pip install --upgrade pip
            pip install -r requirements.txt
          fi

      - name: Run unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Run KITN pipeline
        env:
          BKAM_API_KEY: ${{ secrets.BKAM_API_KEY }}
        run: PYTHONPATH=. python -m pipeline.run_pipeline

      - name: Sync search index to public for Vite production build
        run: |
          if [ -f data/index/search-index.json ]; then
            mkdir -p public/data/index
            cp data/index/search-index.json public/data/index/search-index.json
          fi

      - name: Sync Academy content to public for Vite production build
        run: |
          if [ -f data/academy/academy.json ]; then
            mkdir -p public/data/academy
            cp data/academy/academy.json public/data/academy/academy.json
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify root Vite build
        run: |
          npm install
          npm run build

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ public/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): mise à jour automatique de la veille KITN"
            branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            for attempt in 1 2 3; do
              git fetch origin "$branch"
              git pull --rebase --autostash origin "$branch"
              if git push origin "HEAD:$branch"; then
                exit 0
              fi
              echo "Push concurrent détecté (tentative $attempt/3)."
              sleep $((attempt * 2))
            done
            echo "Impossible de pousser les données après trois tentatives."
            exit 1
          else
            echo "Aucun changement détecté à pousser."
          fi
