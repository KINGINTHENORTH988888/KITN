name: KITN Veille Automatisée

on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: kitn-veille-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies if present
        run: |
          if [ -f requirements.txt ]; then
            pip install --upgrade pip
            pip install -r requirements.txt
          fi

      - name: Run unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Run KITN pipeline
        run: PYTHONPATH=. python -m pipeline.run_pipeline

      - name: Sync search index to public for Vite production build
        run: |
          if [ -f data/index/search-index.json ]; then
            mkdir -p public/data/index
            cp data/index/search-index.json public/data/index/search-index.json
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify root Vite build
        run: |
          npm install
          npm run build

      - name: Commit and push updated data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ public/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): mise à jour automatique de la veille KITN"
            git push
          else
            echo "Aucun changement détecté à pousser."
          fi
