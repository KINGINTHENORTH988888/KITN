name: KITN Veille Automatisée

on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "chatgpt/kitn-stabilisation-2026-11"
    paths:
      - ".github/workflows/main.yml"
      - "pipeline/**"
      - "data/sources.json"
      - "package.json"
      - "package-lock.json"
      - "requirements.txt"
      - "src/**"

# Les vérifications de pull request sont strictement en lecture seule.
permissions:
  contents: read

concurrency:
  group: kitn-veille-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pull-request:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies if present
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          fi

      - name: Run unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Validate current HCP regional PDF (read-only)
        run: PYTHONPATH=. python scripts/validate_hcp_emo_regional_live.py

      - name: Validate HCP 2026 social indicators PDF (read-only)
        run: PYTHONPATH=. python scripts/validate_hcp_social_live.py

      - name: Report statistical dataset distribution
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from datetime import date
          from pathlib import Path

          path = Path("data/statistics.json")
          if not path.exists():
              print("STATISTICS DATASET: missing")
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding="utf-8"))
          indicators = data.get("indicators", [])
          print("STATISTICS TOTAL:", data.get("indicator_count"), "| actual array length:", len(indicators))
          print("STATISTICS BY POLE:", json.dumps(Counter(x.get("pole") or "(missing)" for x in indicators), ensure_ascii=False, sort_keys=True))
          print("STATISTICS BY CATEGORY:", json.dumps(Counter(x.get("category") or "(missing)" for x in indicators), ensure_ascii=False, sort_keys=True))
          print("STATISTICS BY SOURCE:", json.dumps(Counter(x.get("source_name") or "(missing)" for x in indicators), ensure_ascii=False, sort_keys=True))
          print("STATISTICS WITHOUT POLE:", sum(not x.get("pole") for x in indicators))
          social = [
              {"key": x.get("indicator_code") or x.get("id"), "label": x.get("label_fr"), "source": x.get("source_name"), "unit": x.get("unit_fr")}
              for x in indicators if x.get("pole") == "societe_developpement_humain"
          ]
          print("SOCIAL SERIES DETAILS:", json.dumps(social, ensure_ascii=False))
          index_path = Path("data/index/search-index.json")
          if index_path.exists():
              index = json.loads(index_path.read_text(encoding="utf-8"))
              items = index.get("items", [])
              today = date.today().isoformat()
              future = [
                  x for x in items
                  if x.get("date_anomalie")
                  or x.get("date_statut") == "date_future_a_verifier"
                  or (
                      len(str(x.get("date_publication") or "")[:10]) == 10
                      and str(x.get("date_publication") or "")[:10][4:5] == "-"
                      and str(x.get("date_publication") or "")[:10] > today
                  )
              ]
              print("DOCUMENT INDEX:", index.get("total"), "| visible after future-date exclusion:", len(items) - len(future), "| future-dated to verify:", len(future), "| reference date:", today)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify root Vite build
        run: |
          npm ci
          npm audit --json > /tmp/kitn-npm-audit.json || true
          node -e 'const a=require("/tmp/kitn-npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log("NPM AUDIT:", name, "| severity:", v.severity, "| direct:", v.isDirect, "| fix:", JSON.stringify(v.fixAvailable), "| via:", (v.via||[]).map(x => typeof x === "string" ? x : x.name).join(", "))'
          npm run test:frontend
          npm run build

  collect-and-update:
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies if present
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          fi

      - name: Run unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Run KITN pipeline
        env:
          BKAM_API_KEY: ${{ secrets.BKAM_API_KEY }}
        run: PYTHONPATH=. python -m pipeline.run_pipeline

      - name: Sync Academy content to public for Vite production build
        run: |
          if [ -f data/academy/academy.json ]; then
            mkdir -p public/data/academy
            cp data/academy/academy.json public/data/academy/academy.json
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify root Vite build
        run: |
          npm ci
          npm run test:frontend
          npm run build

      - name: Commit and push generated data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/index/search-index.json data/sources-health.json data/statistics.json data/regional-statistics.json public/data/index/search-index.json public/data/statistics.json public/data/regional-statistics.json public/data/academy/academy.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): mise à jour automatique de la veille KITN"
            branch="$GITHUB_REF_NAME"
            for attempt in 1 2 3; do
              git fetch origin "$branch"
              git pull --rebase --autostash origin "$branch"
              if git push origin "HEAD:$branch"; then
                exit 0
              fi
              echo "Push concurrent détecté (tentative $attempt/3)."
              sleep $((attempt * 2))
            done
            echo "Impossible de pousser les données après trois tentatives."
            exit 1
          else
            echo "Aucun changement détecté à pousser."
          fi
