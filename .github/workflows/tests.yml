name: Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "pipeline/**"
      - "tests/**"
      - "data/sources.json"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "tests/**"
      - "data/sources.json"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
