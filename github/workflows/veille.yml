name: KITN Veille Automatisée

on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run KITN pipeline
        env:
          PYTHONPATH: .
        run: python -m pipeline.run_pipeline

      - name: Commit and push updated data
        run: |
          git config user.name "kitn-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Aucun changement dans data/ à enregistrer."
          else
            git commit -m "chore(veille): mise à jour automatique des publications et index"
            git push
          fi
